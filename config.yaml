paths:
  esc50_audio_dir: audio
  esc50_meta_csv: meta/esc50.csv
  raw_recordings_dir: my_recordings_raw
  processed_dir: data/processed
  manifest_csv: data/processed/manifest.csv
  feature_cache_dir: data/features
  output_dir: artifacts
audio:
  sample_rate: 16000
  window_seconds: 1.0
  hop_seconds: 1.0
  peak_target: 0.95
  max_gain_db: 20.0
  silence_rms: 0.005
classes:
  background: background
  esc50_map:
    siren: siren
    car_horn: car
    clock_alarm: alarm
    door_wood_knock: knock
    crying_baby: people
    sneezing: people
    coughing: people
    clapping: people
    cheering: people
    laughter: people
    snoring: people
    dog: people
    cat: people
  order:
  - siren
  - car
  - alarm
  - knock
  - people
  - background
prepare:
  esc50_source: esc50
  own_source: own
  background_ratio: 4.0
  overlap_seconds: 0.0
splits:
  esc50_folds:
    train:
    - 1
    - 2
    - 3
    val:
    - 4
    test:
    - 5
  own_ratios:
    train: 0.7
    val: 0.15
    test: 0.15
  seed: 42
features:
  kind: microfrontend
  channels: 40
  window_ms: 30
  step_ms: 20
  lower_band_limit_hz: 125.0
  upper_band_limit_hz: 7500.0
  output_scale_shift: 0.0
  left_context: true
  right_context: true
  value_scale: 255.0
training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  patience: 10
  seed: 42
  shuffle_buffer: 1024
  num_parallel_loads: 2
  max_class_weight: 10.0
augment:
  enabled: true
  copies_per_sample: 3
  noise_snr_db:
  - 0.0
  - 20.0
  noise_probability: 0.6
  gain_db:
  - -6.0
  - 6.0
  shift_ms: 100.0
  noise_pool_size: 192
